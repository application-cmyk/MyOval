<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyOval Admin - Assistenza Soci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
    "firebase/app-check": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js"
  }
}
</script>
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm fixed-top">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold"><i class="fas fa-user-shield me-2"></i> ADMIN CONTROL PANEL</span>
            <button class="btn btn-sm btn-outline-light" onclick="window.location.href='index.html'">CHIUDI</button>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4">
                    <h4 class="fw-bold mb-3">Pannello Assistenza Soci</h4>
                    <p class="text-muted small">Usa il <strong>Codice FIR</strong> per accedere direttamente. (Le altre
                        opzioni saranno attivate prossimamente).</p>

                    <!-- SEZIONE CODICE FIR (ATTIVO) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-danger">ACCEDI CON CODICE FIR</label>
                        <div class="input-group">
                            <input type="text" id="inp-fir" class="form-control" placeholder="Inserisci Codice FIR...">
                            <button class="btn btn-danger fw-bold" id="btn-fir">APRI FIR</button>
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- SEZIONE EMAIL (DISABILITATA) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">ACCEDI CON EMAIL (Prossimamente)</label>
                        <div class="input-group">
                            <input type="text" id="inp-email" class="form-control" placeholder="Inserisci Email..."
                                disabled>
                            <button class="btn btn-secondary fw-bold" id="btn-email" disabled>APRI EMAIL</button>
                        </div>
                    </div>

                    <!-- SEZIONE ID FAMIGLIA (DISABILITATA) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">ACCEDI CON ID FAMIGLIA
                            (Prossimamente)</label>
                        <div class="input-group">
                            <input type="text" id="inp-famiglia" class="form-control"
                                placeholder="Inserisci ID Famiglia..." disabled>
                            <button class="btn btn-secondary fw-bold" id="btn-famiglia" disabled>APRI ID</button>
                        </div>
                    </div>

                    <!-- Container risultati futuro (se servirà per email/id famiglia) -->
                    <div id="risultati-ricerca" class="list-group list-group-flush mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/admin_control.js"></script>
</body>

</html>
