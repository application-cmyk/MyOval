<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyOval - Shop Iscrizioni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/app-check": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js"
      }
    }
    </script>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark shadow-sm fixed-top" style="background-color: #a00000 !important;">
        <div class="container-fluid px-md-5">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="logo-as-rugby-milano.png" class="header-logo me-2">
                <span class="fw-bold h4 mb-0" style="letter-spacing: 1px;">MYOVAL</span>
            </a>
            <div class="d-flex align-items-center">
                <span id="user-email-display-shop" class="text-white me-3 small d-none d-md-inline"></span>
                <button class="btn btn-sm btn-outline-light rounded-pill px-4 fw-bold"
                    onclick="window.location.href='index.html'">TORNA ALLA HOME</button>
            </div>
        </div>
    </nav>

    <div id="loading-overlay"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(244, 247, 246, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10000;">
        <div class="spinner-border text-danger" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
        <h5 class="mt-3 text-muted fw-bold small text-uppercase">Sincronizzazione in corso...</h5>
    </div>

    <div class="container mt-2">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-8">

                <!-- Header con Carrello Pill -->
                <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                    <h2 class="fw-bold text-danger mb-0 text-uppercase" style="font-size: 1.2rem;">Iscrizioni</h2>
                    <div
                        class="cart-summary-pill shadow-sm py-1 px-3 d-flex align-items-center gap-2 bg-white rounded-pill border">
                        <i class="fas fa-shopping-cart text-danger"></i>
                        <span class="fw-bold" id="cart-count">0</span>
                    </div>
                </div>

                <!-- CONTENITORE CARRELLO (RICEVUTA) -->
                <div id="cart-integrated-container" class="mb-2 d-none"></div>

                <!-- SEPARATORE (Appare solo se c'è qualcosa nel carrello) -->
                <div id="ui-shop-divider" class="shop-divider d-none"></div>

                <!-- Area Catalogo -->
                <div id="shop-content-area">
                    <!-- ... categorie e articoli ... -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODALE CONFIGURATORE (Assicurati che questi ID esistano!) -->
    <div class="modal fade" id="modalConfiguratore" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg" style="border-radius: 20px; border:none;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark" id="conf-titolo-articolo">Configurazione</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div id="conf-membri-list" class="d-flex flex-column gap-2 mb-4"></div>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <div>
                            <div class="h4 fw-bold text-danger mb-0" id="conf-display-prezzo">0,00 €</div>
                        </div>
                        <button class="btn btn-danger fw-bold px-4 py-2 rounded-pill" id="btn-add-to-cart"
                            onclick="window.addToCart()" disabled>AGGIUNGI</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./src/shop.js?v=2.6.2"></script>
</body>

</html>
