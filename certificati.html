<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyOval - Registra Certificato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/app-check": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js"
      }
    }
    </script>

</head>

<body class="bg-light">

  <nav class="navbar navbar-dark shadow-sm fixed-top" style="background-color: #a00000 !important;">
    <div class="container-fluid px-md-5">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <!-- Puntamento al file locale -->
        <img src="logo-as-rugby-milano.png" alt="Logo" class="header-logo me-2">
        <span class="fw-bold h4 mb-0" style="letter-spacing: 1px;">MYOVAL</span>
      </a>
      <div class="d-flex align-items-center">
        <!-- ID specifico per questa pagina -->
        <span id="user-email-display-cert" class="text-white me-3 small d-none d-md-inline"></span>
        <button class="btn btn-sm btn-outline-light rounded-pill px-4 fw-bold" onclick="location.href='index.html'">
          TORNA ALLA HOME
        </button>
      </div>
    </div>
  </nav>

  <div class="container mt-5 pt-5">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">

        <!-- SELETTORE ATLETA (Bolle rimpicciolite) -->
        <div class="family-header text-center mb-3">
          <small class="text-muted fw-bold text-uppercase">Per chi vuoi registrare il certificato?</small>
        </div>
        <div class="family-nav mb-4 justify-content-center" id="atleti-selector"></div>

        <!-- CARD DI UPLOAD -->
        <div class="main-card shadow-sm p-4 border-0 animate__animated animate__fadeIn">
          <div class="text-center mb-4">
            <i class="fas fa-file-medical fa-3x text-danger mb-3"></i>
            <h4 class="fw-bold">Carica Certificato Medico</h4>
            <p class="text-muted" id="nome-atleta-selezionato">Seleziona un tesserato dalle bolle sopra</p>
          </div>

          <form id="uploadForm" onsubmit="return false">
            <div class="row g-4">
              <div class="col-md-6">
                <label class="label-xs">Data di Scadenza del certificato</label>
                <input type="date" class="form-control form-control-lg shadow-none" id="scadenzaInput" required>
              </div>
              <div class="col-md-6">
                <label class="label-xs">Seleziona il file (PDF o Immagine)</label>
                <input type="file" class="form-control form-control-lg shadow-none" id="fileInput"
                  accept="application/pdf,image/*" required>
              </div>
            </div>

            <button type="button" class="btn btn-danger w-100 py-3 mt-5 fw-bold shadow" id="btnUpload"
              onclick="window.avviaUpload()">
              <i class="fas fa-cloud-upload-alt me-2"></i> MEMORIZZA IL CERTIFIFICATO
            </button>
          </form>

          <div id="status-message" class="mt-4"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Loading Overlay per l'upload -->
  <div id="upload-overlay" class="d-none"
    style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:3000; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
    <h5 class="mt-3 fw-bold">Trasferimento file in corso...</h5>
  </div>
  <script type="module" src="./src/certificati.js?v=2.3.1"></script>

</body>

</html>
