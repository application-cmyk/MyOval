<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyOval - Pagamenti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- SDK PAYPAL -->
    <script
        src="https://www.paypal.com/sdk/js?client-id=AcnRqEqbrhdy0HfvREZ_BPSPnhGl375ww7j8FKTTPgQUbaSlDx61fWjHgcBoD1_P6OyuY2UInuuER87C&currency=EUR"></script>

    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/app-check": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js"
      }
    }
    </script>
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark shadow-sm fixed-top" style="background-color: #a00000 !important;">
        <div class="container-fluid px-md-5">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="logo-as-rugby-milano.png" class="header-logo me-2">
                <span class="fw-bold h4 mb-0" style="letter-spacing: 1px;">MYOVAL</span>
            </a>
            <div class="d-flex align-items-center">
                <span id="user-email-display-pagamenti" class="text-white me-3 small d-none d-md-inline"></span>
                <button class="btn btn-sm btn-outline-light rounded-pill px-4 fw-bold"
                    onclick="location.href='index.html'">
                    TORNA ALLA HOME
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">

                <!-- SELETTORE FAMIGLIA -->
                <div class="family-header text-center mb-2">
                    <small class="text-muted fw-bold text-uppercase" style="font-size: 10px; letter-spacing: 1px;">
                        Per chi vuoi effettuare il pagamento?
                    </small>
                </div>
                <div class="family-nav mb-4" id="pagamenti-family-selector"></div>

                <!-- CARRELLO -->
                <div id="cart-container" class="cart-card shadow-sm d-none mb-4 animate__animated animate__fadeIn">
                    <div class="cart-header">
                        <span><i class="fas fa-shopping-cart me-2" style="color: #dc3545;"></i> RIEPILOGO
                            PAGAMENTI</span>
                        <span class="badge rounded-pill" id="cart-items-badge">0 Articoli</span>
                    </div>

                    <div class="cart-table-head d-none d-md-flex row m-0">
                        <div class="col-6">Beneficiario</div>
                        <div class="col-3 text-center">Listino</div>
                        <div class="col-3 text-end">Totale</div>
                    </div>

                    <div id="cart-rows-container"></div>

                    <div class="cart-footer">
                        <div class="row align-items-center">
                            <div class="col-6">
                                <div class="total-label">Totale da Pagare:</div>
                                <div class="total-amount" id="cart-total-display">0,00 €</div>
                            </div>
                            <div class="col-6 text-end">
                                <div id="paypal-button-container">
                                    <button class="btn btn-conferma-procedi" id="btn-finto-procedi">
                                        Conferma e Procedi <i class="fas fa-arrow-right ms-2"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- LISTA PRODOTTI -->
                <div id="products-list-area" class="mb-5">
                    <div class="text-center p-5">
                        <div class="spinner-border text-danger"></div>
                    </div>
                </div>

                <!-- SEZIONE STORICO: PAGAMENTI EFFETTUATI (MODIFICA 2) -->
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden mt-4">
                    <div class="card-header bg-dark text-white d-flex align-items-center justify-content-between py-3">
                        <span class="fw-bold fs-6">
                            <i class="fas fa-receipt me-2 text-danger"></i>PAGAMENTI EFFETTUATI
                        </span>
                        <button class="btn btn-sm btn-outline-light rounded-pill px-3"
                            onclick="window.caricaStoricoPagamenti()">
                            <i class="fas fa-sync-alt me-1"></i> Aggiorna
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" style="font-size: 13px;">
                                <thead class="table-light">
                                    <tr style="font-size: 11px; text-transform: uppercase; color: #777;">
                                        <th class="ps-3 py-2">ID Ordine</th>
                                        <th class="py-2">Data Ordine</th>
                                        <th class="py-2">Partecipante</th>
                                        <th class="py-2">Articolo</th>
                                        <th class="text-center py-2">Q.tà</th>
                                        <th class="text-end py-2">Totale</th>
                                        <th class="text-center py-2">Stato</th>
                                        <th class="pe-3 py-2">Data Pagamento</th>
                                    </tr>
                                </thead>
                                <tbody id="storico-pagamenti-tbody">
                                    <tr>
                                        <td colspan="8" class="text-center py-4 text-muted">
                                            <div class="spinner-border spinner-border-sm text-danger me-2"></div>
                                            Caricamento storico...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Overlay Caricamento -->
    <div id="loading-overlay-pagamenti" class="d-none"
        style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:3000; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
        <h5 class="mt-3 fw-bold">Elaborazione pagamento...</h5>
    </div>

    <script type="module" src="./src/pagamenti.js"></script>
</body>

</html>
